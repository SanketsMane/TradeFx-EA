# TradeFx — nginx site for tradefx.in
#
# This server is shared with other projects (hcfinvest.com, refilify). This
# file is additive: it declares no default_server, touches no other site, and
# proxies only to TradeFx's own port. Installed as
# /etc/nginx/sites-available/tradefx.in and symlinked into sites-enabled.
#
# Certbot rewrites this file when the certificate is issued, adding the 443
# block and the HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name tradefx.in www.tradefx.in;

    # Let certbot answer the HTTP-01 challenge from disk.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/tradefx/web;
    index index.html;

    include snippets/tradefx-security-headers.conf;

    # Hashed build assets are immutable; index.html must never be cached or
    # visitors keep the old bundle after a deploy.
    location /assets/ {
        # One Cache-Control only. `expires` emits its own, so using it
        # alongside add_header ships two conflicting values.
        # Re-included: the Cache-Control below would otherwise drop them.
        include snippets/tradefx-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Every prerendered route is an index.html, not just the root one, so this
    # matches by extension. A regex location outranks the prefix ones above,
    # which is fine — no asset served from /assets/ ends in .html.
    location ~* \.html$ {
        include snippets/tradefx-security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # The build prerenders each public route to <route>/index.html, so a
    # crawler is served real HTML instead of an empty SPA shell. Resolve that
    # file explicitly rather than with `$uri/`, which probes any directory and
    # previously made /products 301 to a same-named asset folder.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
