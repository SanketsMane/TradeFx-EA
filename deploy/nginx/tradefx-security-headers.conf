# TradeFx security headers.
#
# Kept in a snippet because of an nginx trap: add_header directives are NOT
# merged across levels. A `location` that declares even one add_header of its
# own discards every header inherited from the server block. Our /assets/ and
# /index.html locations set Cache-Control, which silently stripped the entire
# security header set from exactly the responses that matter most — the HTML
# document. Including this file in each such location restores them.
#
# HSTS: one year, apex only. Deliberately no includeSubDomains and no preload —
# both are cached by browsers for the full max-age and would force HTTPS on
# subdomains that do not exist yet (staging, api). Add them once every
# subdomain is known to be TLS-only.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
